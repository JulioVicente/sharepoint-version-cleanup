name: Tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Verify release manifest
        shell: pwsh
        run: |
          $manifest = Get-Content release-manifest.json -Raw | ConvertFrom-Json -AsHashtable
          foreach ($path in $manifest.Files.Keys) {
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $manifest.Files[$path]) {
              throw "SHA256 mismatch: $path"
            }
          }
      - name: Install test dependency
        shell: pwsh
        run: Install-PSResource Pester -Version 5.7.1 -Scope CurrentUser -TrustRepository -Quiet
      - name: Run unit tests
        shell: pwsh
        run: ./tests/Run-Tests.ps1
      - name: Verify real Windows CAPI and CNG key ACLs
        shell: pwsh
        run: ./tests/Test-KeyAclIntegration.ps1 -MachineKey
      - name: Verify real LOCAL SERVICE task execution and failure diagnostics
        shell: pwsh
        run: ./tests/Test-ServiceTaskIntegration.ps1
      - name: Verify production worker with real PnP and LOCAL SERVICE
        shell: pwsh
        run: |
          Install-PSResource PnP.PowerShell -Version 3.4.1 -Scope AllUsers -TrustRepository -Quiet
          $manifest = Join-Path $env:ProgramFiles 'PowerShell/Modules/PnP.PowerShell/3.4.1/PnP.PowerShell.psd1'
          ./tests/Test-ServiceContextIntegration.ps1 -ModulePath $manifest
      - name: Verify uninstall archive and Windows ACLs
        shell: pwsh
        run: ./tests/Test-UninstallIntegration.ps1
